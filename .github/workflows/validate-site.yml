name: Validate site

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "assets/**"
      - "data/**"
      - "robots.txt"
      - "sitemap.xml"
      - "tools/**"
      - ".github/workflows/validate-site.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate structured content
        run: python tools/validate_content.py

      - name: Validate HTML, local links, sitemap and repository hygiene
        run: python tools/validate_site.py

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check content.js
