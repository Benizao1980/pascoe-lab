name: Update GitHub resources

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh public repositories
        run: python tools/update_github_resources.py
      - name: Commit changes
        run: |
          if git diff --quiet -- resources.html; then
            echo "No GitHub resource changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources.html
          git commit -m "Update public GitHub resources"
          git push
