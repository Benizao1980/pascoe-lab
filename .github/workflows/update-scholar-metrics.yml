name: Update publications and Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: publication-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronise publications and Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_AUTHOR_ID: UQrZ-fgAAAAJ
        run: python tools/update_publications.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/publications.json data/scholar-metrics.json data/publication-sync.json; then
            echo "No publication or metric changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/scholar-metrics.json data/publication-sync.json
          git commit -m "Update publications and Google Scholar metrics"
          git push
